syntax = "proto3";

package post.v1;

service PostService {
    rpc CreatePost (CreatePostRequest) returns (PostResponse);
    rpc FindOne (FindOneRequest) returns (PostResponse);
    rpc FindAll (Empty) returns (PostListResponse);
}

message Empty {}

message CreatePostRequest {
    string title = 1;
    string content = 2;
}

message FindOneRequest {
    int32 id = 1;
}

message PostResponse {
    int32 id = 1;
    string title = 2;
    string content = 3;
}

message PostListResponse {
  repeated PostResponse posts = 1;
}