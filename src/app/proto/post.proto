syntax = "proto3";

package post.v1;

service PostService {
  rpc CreatePost (PostCreateRequest) returns (PostResponse);
  rpc GetPost (GetRequest) returns (PostResponse);
  rpc ListPost (ListRequest) returns (PostListResponse);
}

message PostCreateRequest {
  string title = 1;
  string content = 2;
  int32 userId = 3;
}

message GetRequest {
  int32 id = 1;
}

message ListRequest {
  int32 userId = 1;
}

message PostResponse {
  int32 id = 1;
  string title = 2;
  string content = 3;
  int32 userId = 4;
}

message PostListResponse {
  repeated PostResponse posts = 1;
}